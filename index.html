<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HortaUrbana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="login-page">
    <section class="login-box">
        <h1>🌿 HortaUrbana</h1>
        <p>Sistema inteligente para hortas comunitárias</p>

        <!-- Adicionamos um ID ao formulário para o JS capturar -->
        <form id="form-login">
            <label>Usuário</label>
            <input type="text" required placeholder="Digite seu usuário">

            <label>Senha</label>
            <input type="password" required placeholder="Digite sua senha">

            <label>Perfil</label>
            <!-- Adicionamos um ID ao select para ler a escolha -->
            <select id="select-perfil">
                <option value="voluntario">Voluntário</option>
                <option value="administracao">Administração</option>
            </select>

            <!-- Apenas UM botão agora, que faz a lógica -->
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
    </section>
</main>

<script>
    const form = document.getElementById('form-login');
    const perfil = document.getElementById('select-perfil');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Impede o recarregamento da página

        // Verifica o que foi selecionado e redireciona
        if (perfil.value === 'voluntario') {
            window.location.href = "mapa.html";
        } else {
            window.location.href = "administracao.html";
        }
    });
</script>

</body>
</html>
